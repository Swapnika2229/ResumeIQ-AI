{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="container py-5" style="max-width:500px;">

    <!-- Logo -->
    <div class="text-center mb-4">

        <img src="{{ url_for('static', filename='images/branding/logo.png') }}"
             alt="ResumeIQ AI"
             style="width:90px;height:90px;object-fit:contain;">

        <h2 class="text-white mt-3 fw-bold">
            ResumeIQ AI
        </h2>

    </div>

    {% if success %}

    <div class="alert alert-success">
        {{ success }}
    </div>

    {% endif %}

    {% if error %}

    <div class="alert alert-danger">
        {{ error }}
    </div>

    {% endif %}

    <form method="POST">

        <div class="mb-3">

            <input
                type="email"
                name="email"
                class="form-control"
                placeholder="Email"
                required>

        </div>

        <div class="mb-3">

            <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Password"
                required>

        </div>

        <button
            type="submit"
            class="btn btn-primary w-100">

            Login

        </button>

    </form>

    <div class="text-center mt-3">

        <a href="/register">
            Create New Account
        </a>

    </div>

</div>

{% endblock %}
